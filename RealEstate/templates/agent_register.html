
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Registration</title>


    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="icon" type="image/png" href="{% static 'images/fav.png' %}">
    <!-- 
        - custom css link
        -->
        <link rel="stylesheet" href="{% static 'css/style.css' %}">

        <link rel="stylesheet" href="{% static 'css/register.css' %}">

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    {% include "homeverse/nav.html" %}
    
    <div class="container">
            
            
            {% if messages %}
        <ul>
            {% for message in messages %}
            <li>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        <form method="POST" action="{% url 'agent_register' %}" enctype="multipart/form-data">
            
            <h2>Agent Registration Form</h2>
            {% csrf_token %}
            
            
            
            
            
            <div class="input-group mb-3">
                <span class="input-group-text" id="basic-addon1"><ion-icon name="person"></ion-icon></span>
                <input type="text" name ="username" class="form-control" placeholder="Username" aria-label="Username" aria-describedby="basic-addon1">
            </div>
            
            <div class="input-group mb-3">         
                <span class="input-group-text" id="basic-addon1"><ion-icon name="person-outline"></ion-icon></span>
                <input type="email" placeholder="example@gmail.com" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp basic-addon1"  >
                
            </div>
            
            <div class="input-group mb-3">
                <span class="input-group-text"><ion-icon name="key"></ion-icon></span>
                <input type="password" id="password" name="password" required class="form-control" >
                <span class="input-group-text cursor" onclick="togglePassword()"><ion-icon name="eye"></ion-icon></span>
            </div>
            
            

            <div class="input-group mb-3">
                <span class="input-group-text" id="basic-addon1"><ion-icon name="man"></ion-icon></span>
                <input type="text" name ="first_name" class="form-control" placeholder="UsernFirstame" aria-label="Username" aria-describedby="basic-addon1" required>
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text" id="basic-addon1"><ion-icon name="woman"></ion-icon></span>
                <input type="text" name ="last_name" class="form-control" placeholder="UsernFirstame" aria-label="Username" aria-describedby="basic-addon1" required>
            </div>
            
            <div class="input-group">
                <span class="input-group-text"><ion-icon name="location"></ion-icon></span>
                <textarea class="form-control" aria-label="With textarea" name="residential_address" placeholder="Residential Address" required></textarea>
              </div>
            
            
            <div class="mb-3">
                <label for="formFile" class="form-label">Passport</label>
                <input class="form-control" type="file" id="formFile" name="passport" accept="image/*" required>
            </div>            
            <button class="btn" type="submit">Register</button>
            <p class="text-center">Already registered with us?<a href="{% url 'login'%}">Login</a></p>
        </form>
    </div>
    <br><br><br>
    
         
<script>
    function togglePassword() {
        var passwordField = document.getElementById("password");
        var passwordField = document.getElementById("password");
        var eyeIcon = document.getElementById("eye-icon");
        
        // Toggle password visibility
        if (passwordField.type === "password") {
            passwordField.type = "text"; // Show the password
            eyeIcon.name = "eye-off"; // Change the icon to "eye-off"
        } else {
            passwordField.type = "password"; // Hide the password
            eyeIcon.name = "eye"; // Change the icon back to "eye"
        }
    }
</script>
    

</body>
</html>
