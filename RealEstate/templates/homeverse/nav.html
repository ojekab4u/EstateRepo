{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- 
    - favicon
-->

{% comment %} <link rel="icon" type="image/png" href="{% static 'images/fav.png' %}"> {% endcomment %}

 

  <!-- 
    - google font link
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet">
</head>

</head>
<body>
  
  <header class="header" data-header>

    <div class="overlay" data-overlay></div>

    <div class="header-top">
      <div class="container">

        <ul class="header-top-list">

          <li>
            <a href="mailto:info@comfyhome.com" class="header-top-link">
              <ion-icon name="mail-outline"></ion-icon>

              <span>info@comfyhome.com</span>
            </a>
          </li>

          <li>
            <a href="#" class="header-top-link">
              <ion-icon name="location-outline"></ion-icon>
              <address>15,Odo Ona Ibadan, Nigeria</address>
            </a>
          </li>

        </ul>

        <div class="wrapper">
          <ul class="header-top-social-list">

            <li>
              <a href="#" class="header-top-social-link">
                <ion-icon name="logo-facebook"></ion-icon>
              </a>
            </li>

            <li>
              <a href="#" class="header-top-social-link">
                <ion-icon name="logo-twitter"></ion-icon>
              </a>
            </li>

            <li>
              <a href="#" class="header-top-social-link">
                <ion-icon name="logo-instagram"></ion-icon>
              </a>
            </li>

            <li>
              <a href="#" class="header-top-social-link">
                <ion-icon name="logo-pinterest"></ion-icon>
              </a>
            </li>

          </ul>
          <a class="header-top-btn" href="{% url 'property_create'%}">Add Listing</a>        
        </div>

      </div>
    </div>
    

    <div class="header-bottom">
      <div class="container">

        <a href="{% url 'index'%}" class="logo">
          <img src="{% static 'images/logo.png'%}" alt="Homeverse logo">
        </a>
        
        <nav class="nav_bar" data-navbar>  
          
          <div class="nav_bar-top">
            
            <a href="{% url 'index'%}" class="logo">
              <img src="{% static 'images/logo.png'%}" alt="Homeverse logo">
            </a>
            
            <button class="nav-close-btn" data-nav-close-btn aria-label="Close Menu">
              <ion-icon name="close-outline"></ion-icon>
            </button>
            
          </div>
          
          <div class="nav_bar-bottom">
            <ul class="nav_bar-list">
              
              <li>
                <a href="{% url 'index'%}" class="nav_bar-link" data-nav-link>Home</a>
              </li>

              <li>
                <a href="{% url 'about'%}" class="nav_bar-link" data-nav-link>About</a>
              </li>

              <li>
                <a href="{% url 'service'%}" class="nav_bar-link" data-nav-link>Service</a>
              </li>
              <li>
                <a href="{% url 'property_list'%}" class="nav_bar-link" data-nav-link>Property</a>
              </li>
             

              <li> 
                <a href="{% url 'blog' %}" class="nav_bar-link" data-nav-link>Blog</a>
              </li>

              <li>
                <a href="{% url 'contact'%}" class="nav_bar-link" data-nav-link>Contact</a>
              </li>

            </ul>
          </div>
    </nav>
      

        <div class="header-bottom-actions">

          <button class="header-bottom-actions-btn" aria-label="Search">
            <ion-icon name="search-outline"></ion-icon>
            <a href="{% url 'property_search' %}">
              <span>Search</span>
            </a>
          </button>
          
          <button class="header-bottom-actions-btn" aria-label="Profile">
            <ion-icon name="person-outline"></ion-icon>            
            {% if request.user.is_authenticated %}     
            <a href="logout" class="logout_btn text-white">
              <span>Profile</span>
            </a>
            {% else %}
            <a href="{% url 'login' %}">
              <span>Profile</span>
            </a>
            {% endif %}
          </button>
          
          <button class="header-bottom-actions-btn" aria-label="Cart">
            <ion-icon name="cart-outline"></ion-icon>            
            <a href="{% url 'property_list' %}">
              <span>Cart</span>
            </a>
          </button>

          <button class="header-bottom-actions-btn" data-nav-open-btn aria-label="Open Menu">
            <ion-icon name="menu-outline"></ion-icon>

            <span>Menu</span>
          </button>

        </div>

      </div>
    </div>

  </header>


  

     <!-- 
    - custom js link
  -->
  <script src="{% static 'js/script.js'%}"></script>

  <!-- 
    - ionicon link
  -->
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>


</body>
</html>
  <!-- 
    - #HEADER
  -->
